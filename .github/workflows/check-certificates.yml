name: Certificate Expiry Check

on:
  schedule:
    # Run every Monday and Thursday at 9:00 AM UTC
    - cron: "0 9 * * 1"
    - cron: "0 9 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-certificates:
    name: Check Azure Certificate Expiration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure OIDC Login (Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run certificate check
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set +e
          python -m check_certificates
          exit_code=$?
          set -e
          # Exit 1 = expiring certs found (alert sent to Slack, not a CI failure)
          # Exit 2 = runtime error (actual failure)
          if [ $exit_code -eq 2 ]; then exit 1; fi
          exit 0